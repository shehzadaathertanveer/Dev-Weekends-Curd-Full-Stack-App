[build]
  command = "npm install --prefix client && npm run build --prefix client && npm install --prefix server"
  publish = "client/dist"
  functions = "server"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200